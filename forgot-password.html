<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Gnosia</title>
    <link rel="stylesheet" href="Assets/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f1f5f9;">
    
    <!-- Forgot Password Card -->
    <div class="stat-card animate-up" style="width: 100%; max-width: 500px; text-align: center; padding: 40px; box-shadow: var(--shadow);">
        <h2 style="font-size: 2rem; margin-bottom: 20px;">Forgot Your Password?</h2>
        
        <!-- Decorative Icons -->
        <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; font-size: 2rem; color: var(--text-light);">
            <span>💻</span> <span>🔒</span> <span>📱</span>
        </div>
        
        <p style="color: var(--text-light); margin-bottom: 30px; font-size: 0.95rem;">
            Please input your phone number and we will send you a link to reset your password.
        </p>
        
        <!-- Reset Form -->
        <form action="loqin.html">
            <div class="input-box" style="margin: 0 auto 20px auto; max-width: 400px;">
                <input type="tel" placeholder="Enter Phone Number" required style="background: #f8fafc; border: 1px solid #e2e8f0; text-align: center; font-size: 1rem; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 400px; border-radius: 20px; padding: 12px; font-size: 1rem;">
                Send Reset Code
            </button>
        </form>
        
        <!-- Back to Login Link -->
        <div style="margin-top: 25px;">
            <a href="loqin.html" style="color: var(--text-light); font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: color 0.3s ease;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-light)'">
                &larr; Back to Login
            </a>
        </div>
    </div>

</body>
</html>
