<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat dengan Dokter | Gnosia</title>
    <link rel="stylesheet" href="Assets/style.css">
    <style>
        * { box-sizing: border-box; }

        body { background: #f1f5f9; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* ── Nav ── */
        nav { flex-shrink: 0; }

        /* ── Layout ── */
        .chat-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 73px);
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        .sidebar-header h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 9px 12px;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            width: 100%;
        }
        .search-box input::placeholder { color: #94a3b8; }

        .doctor-list { overflow-y: auto; flex: 1; padding: 10px 0; }

        .doctor-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }
        .doctor-item:hover { background: #f8fafc; }
        .doctor-item.active {
            background: #eff6ff;
            border-left-color: var(--primary);
        }
        .doc-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            position: relative;
        }
        .doc-avatar-placeholder {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            position: absolute;
            bottom: 1px;
            right: 1px;
        }
        .doc-info { flex: 1; min-width: 0; }
        .doc-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        .doc-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .doc-time {
            font-size: 0.72rem;
            color: var(--text-light);
            flex-shrink: 0;
        }
        .doc-preview {
            font-size: 0.78rem;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Main Chat Area ── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }

        /* Doctor header */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 28px;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            background: white;
        }
        .chat-header-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .chat-header-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
        }
        .chat-header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #10b981;
            font-weight: 600;
            margin-top: 2px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .date-divider {
            text-align: center;
            margin: 12px 0;
        }
        .date-divider span {
            background: #f1f5f9;
            color: var(--text-light);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 20px;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 6px;
        }
        .msg-row.user-row { flex-direction: row-reverse; }

        .msg-avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
        }
        .msg-avatar-me {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .msg-group { display: flex; flex-direction: column; max-width: 62%; }
        .msg-row.user-row .msg-group { align-items: flex-end; }

        .msg-bubble {
            padding: 13px 18px;
            border-radius: 18px;
            font-size: 0.88rem;
            line-height: 1.6;
            word-break: break-word;
        }
        .msg-bubble.doctor {
            background: #e8f0fe;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }
        .msg-bubble.user-msg {
            background: #1e3a8a;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-time {
            font-size: 0.72rem;
            color: var(--text-light);
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Input bar */
        .chat-input-bar {
            padding: 16px 28px;
            border-top: 1px solid #e2e8f0;
            background: white;
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 16px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); }
        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.9rem;
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
        }
        .input-wrapper input::placeholder { color: #94a3b8; }
        .attach-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .attach-btn:hover { color: var(--primary); }
        .send-btn {
            width: 40px;
            height: 40px;
            background: #1e3a8a;
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s;
        }
        .send-btn:hover { background: var(--primary); transform: scale(1.05); }

        /* Nav profile btn */
        .nav-profile-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--primary); display: flex;
            align-items: center; justify-content: center;
            color: white; cursor: pointer; border: none;
            text-decoration: none; transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }
        .nav-profile-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .doc-info, .sidebar-header h3, .search-box { display: none; }
            .doctor-item { justify-content: center; padding: 12px 0; }
            .chat-messages { padding: 16px; }
            .chat-header, .chat-input-bar { padding: 14px 16px; }
        }
    </style>
</head>

<script>
    if (!localStorage.getItem("isLoggedIn")) {
        window.location.href = "loqin.html";
    }
</script>

<body>
    <!-- Navigation -->
    <nav>
        <a href="index.html" class="logo">Gnosia</a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" style="text-decoration: none; color: var(--text-dark); font-weight: 600;">Home</a>
            <a href="health-store.html" style="text-decoration: none; color: var(--text-dark); font-weight: 600;">Health Store</a>
            <a href="gfit.html" style="text-decoration: none; color: var(--text-dark); font-weight: 600;">Gfit</a>
            <a href="Chat.html" style="text-decoration: none; color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); padding-bottom: 2px;">Chat</a>
            <a href="profile.html" class="nav-profile-btn" title="Profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <div class="chat-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Consultations</h3>
                <div class="search-box">
                    <svg width="14" height="14" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" placeholder="Search doctors..." id="searchInput" oninput="filterDoctors()">
                </div>
            </div>
            <div class="doctor-list" id="doctorList"></div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-main">
            <!-- Chat Header -->
            <div class="chat-header" id="chatHeader">
                <div style="width:48px;height:48px;border-radius:50%;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">👨‍⚕️</div>
                <div>
                    <div class="chat-header-name" id="headerName">Dr. Danis Sauutra</div>
                    <div class="chat-header-status">
                        <span class="status-dot"></span>
                        <span id="headerSpec">Online | General Practitioner</span>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages"></div>

            <!-- Input Bar -->
            <div class="chat-input-bar">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="attach-btn" title="Attach file">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <button class="send-btn" onclick="sendMessage()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script/script.js"></script>
    <script>
        // ── Data dokter ──
        const doctors = [
            {
                id: 1,
                name: "Dr. Danis Sauutra",
                spec: "General Practitioner",
                online: true,
                color: "#0ea5e9",
                initials: "DS",
                time: "12:45 PM",
                preview: "Please continue the exercises...",
                messages: [
                    { from: "doctor", text: "Hello! I've reviewed your latest fitness tracking data. Your heart rate recovery times are improving significantly. How are you feeling after the new cardio routine?", time: "12:30 PM" },
                    { from: "user",   text: "I'm feeling much better, thank you doctor! I did feel a slight tightness in my lower back yesterday after the deadlifts. Is that normal?", time: "12:35 PM" },
                    { from: "doctor", text: "Some soreness is expected, but let's be careful. I've attached a quick guide on the correct posture for your next session. Please continue the exercises as shown in the attachment.", time: "12:45 PM" },
                ]
            },
            {
                id: 2,
                name: "Dr. Sarah Wijaya",
                spec: "Internist",
                online: false,
                color: "#10b981",
                initials: "SW",
                time: "Yesterday",
                preview: "Your lab results look excellent.",
                messages: [
                    { from: "doctor", text: "Hi! Your lab results look excellent. Your cholesterol levels have improved significantly since last month.", time: "Yesterday" },
                    { from: "user",   text: "That's great news! Thank you for monitoring my progress.", time: "Yesterday" },
                ]
            },
            {
                id: 3,
                name: "Dr. Marcus Kim",
                spec: "Cardiologist",
                online: false,
                color: "#1e3a8a",
                initials: "MK",
                time: "Mon",
                preview: "Schedule follow-up for next week.",
                messages: [
                    { from: "doctor", text: "Please schedule a follow-up appointment for next week. We need to check your blood pressure readings again.", time: "Mon" },
                ]
            }
        ];

        let activeDoctor = doctors[0];
        const userName = (() => {
            const e = localStorage.getItem("userEmail") || "";
            return e ? e.split("@")[0].slice(0,2).toUpperCase() : "ME";
        })();

        // ── Render sidebar ──
        function renderSidebar(list) {
            const container = document.getElementById("doctorList");
            container.innerHTML = list.map(doc => `
                <div class="doctor-item ${doc.id === activeDoctor.id ? 'active' : ''}" onclick="selectDoctor(${doc.id})">
                    <div style="position:relative;flex-shrink:0;">
                        <div class="doc-avatar-placeholder" style="background:${doc.color};">${doc.initials}</div>
                        ${doc.online ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="doc-info">
                        <div class="doc-name-row">
                            <span class="doc-name">${doc.name}</span>
                            <span class="doc-time">${doc.time}</span>
                        </div>
                        <div class="doc-preview">${doc.preview}</div>
                    </div>
                </div>
            `).join("");
        }

        // ── Render messages ──
        function renderMessages() {
            const container = document.getElementById("chatMessages");
            const today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" });

            let html = `<div class="date-divider"><span>Today, ${today}</span></div>`;

            activeDoctor.messages.forEach(msg => {
                if (msg.from === "doctor") {
                    html += `
                        <div class="msg-row">
                            <div class="doc-avatar-placeholder msg-avatar-sm" style="background:${activeDoctor.color};">${activeDoctor.initials}</div>
                            <div class="msg-group">
                                <div class="msg-bubble doctor">${msg.text}</div>
                                <div class="msg-time">${msg.time}</div>
                            </div>
                        </div>`;
                } else {
                    html += `
                        <div class="msg-row user-row">
                            <div class="msg-avatar-me">${userName}</div>
                            <div class="msg-group">
                                <div class="msg-bubble user-msg">${msg.text}</div>
                                <div class="msg-time">${msg.time}</div>
                            </div>
                        </div>`;
                }
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // ── Update header ──
        function updateHeader() {
            document.getElementById("headerName").textContent = activeDoctor.name;
            document.getElementById("headerSpec").textContent =
                (activeDoctor.online ? "Online" : "Offline") + " | " + activeDoctor.spec;
        }

        // ── Select doctor ──
        function selectDoctor(id) {
            activeDoctor = doctors.find(d => d.id === id);
            renderSidebar(doctors);
            renderMessages();
            updateHeader();
        }

        // ── Send message ──
        function sendMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const time = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });

            activeDoctor.messages.push({ from: "user", text, time });
            activeDoctor.preview = text;
            activeDoctor.time = time;

            renderMessages();
            renderSidebar(doctors);
            input.value = "";
        }

        // ── Search filter ──
        function filterDoctors() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const filtered = doctors.filter(d => d.name.toLowerCase().includes(q) || d.spec.toLowerCase().includes(q));
            renderSidebar(filtered);
        }

        // ── Init ──
        renderSidebar(doctors);
        renderMessages();
    </script>
</body>
</html>
